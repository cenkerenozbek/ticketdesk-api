name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ticketdesk_test
          POSTGRES_USER: ticketdesk
          POSTGRES_PASSWORD: local-test-db
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U ticketdesk -d ticketdesk_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify -Ppostgres-it
  compose-smoke:
    runs-on: ubuntu-24.04
    env:
      COMPOSE_PROJECT_NAME: ticketdesk-ci
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker compose up -d --build --wait
      - run: python3 scripts/compose_smoke.py seed --state "$RUNNER_TEMP/ticketdesk-smoke.json"
      - run: docker compose down
      - run: docker compose up -d --wait
      - run: python3 scripts/compose_smoke.py check --state "$RUNNER_TEMP/ticketdesk-smoke.json"
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
